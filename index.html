<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container-fluid border text-center  p-4 mt-5" style="width: 450px; border-radius: 10px;">
        <h3>Student Mark</h3>
        <div class="row mt-3">
            <p class="showInputs px-2 py-1" >45</p>
            <p class="showInputs px-2 py-1">78</p>
            <p class="showInputs px-2 py-1">32</p>
            <p class="showInputs px-2 py-1">90</p>
            <p class="showInputs px-2 py-1">56</p>

        </div>

        <div class="row mt-1">
            <input id="inputs" class="col ms-0" type=" text" placeholder="Add a mark">
            <button id="add" class="col">Add</button>
            <button id="sort" class="col">Sort</button>
        </div>

        <div class="row mt-4">
            <div class="bg-light col me-2 mb-0">
                <p id="num" class="mb-0 total">0</p>
                <p id="para" class="color-ligth">Total</p>
            </div>
           <div class="bg-light col mb-0">
                <p id="num" class="mb-0 average">0</p>
                <p id="para" class="color-ligth ">Average</p>
            </div>
        </div>

        <div class="row mt-2 srow">
            <div class="bg-light col me-2 mb-0">
                <p id="num" class="mb-0 highest">0</p>
                <p id="para" class="color-ligth ">Highest</p>
            </div>
            <div class="bg-light col me-2 mb-0">
                <p id="num" class="mb-0 lowest">0</p>
                <p id="para" class="color-ligth ">Lowest</p>
            </div>
            <div class="bg-light col mb-0">
                <p id="num" class="mb-0 passed">0</p>
                <p id="para" class="color-ligth ">Passed</p>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
        <script src="script.js"></script>
</body>

</html>
